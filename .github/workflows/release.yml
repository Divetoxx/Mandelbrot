name: Create Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSYS2 (Windows)
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils
          update: true

      - name: Compile (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y libomp-dev
          g++ -O3 main.cpp -o Mandelbrot_linux -fopenmp -static-libstdc++ -static-libgcc
          strip Mandelbrot_linux
          chmod +x Mandelbrot_linux
          tar -czvf Mandelbrot_linux_x64.tar.gz Mandelbrot_linux

      - name: Compile (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          windres resource.rc -o resource.o
          g++ -O3 main.cpp resource.o -o Mandelbrot_windows.exe -fopenmp -static -D__USE_MINGW_ANSI_STDIO=1
          strip Mandelbrot_windows.exe

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.os }}
          path: Mandelbrot_* 

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.MY_RELEASE_PAT }}
          name: "Mandelbrot set. 24-bit TrueColor. 80-bit long double. OpenMP. Supersampling 8x8 (64 passes). ${{ github.ref_name }}"
          body: |
            ## Mandelbrot set. 24-bit TrueColor. 80-bit long double. OpenMP. Supersampling 8x8 (64 passes).
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%201.jpg" width="800">
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%202.jpg" width="800">
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%203.jpg" width="800">
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%204.jpg" width="800">
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%205.jpg" width="800">
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%206.jpg" width="800">
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%207.jpg" width="800">
            <img src="https://github.com/${{ github.repository }}/raw/main/Mandelbrot%20Set%20Image%208.jpg" width="800">

            ### Features:
            * True 24-bit BGR TrueColor
            * High-Precision Rendering (80-bit)
            * Multi-threaded performance (OpenMP)
            * True SSAA 8x8 (64 independent samples per pixel) direct RGB-space integration
            * The Red, Green, and Blue channels are calculated using sine and cosine waves
          files: |
            binary-ubuntu-latest/Mandelbrot_linux_x64.tar.gz
            binary-windows-latest/Mandelbrot_windows.exe
